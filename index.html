<title>Trainingsplan Arthur 2026/2027</title>
<style>
:root {
  --bg: #000;
  --bg1: #111;
  --bg2: #1a1a1a;
  --bg3: #222;
  --border: #333;
  --text: #fff;
  --text2: #aaa;
  --text3: #666;
  --accent: #e8f;
  --green: #4f4;
  --red: #f44;
  --orange: #fa4;
  --blue: #48f;
  --yellow: #ff4;
  --tab-h: 76px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --header-h: 52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;overscroll-behavior:none}
input,textarea,select{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:16px;width:100%;outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:#555}
input[type=number]{text-align:center}
button{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer;touch-action:manipulation}
button.primary{background:#fff;color:#000;border:none;font-weight:600}
button.danger{background:#300;color:var(--red);border-color:#500}
button.active{background:var(--accent);color:#000;border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row-sb{display:flex;justify-content:space-between;align-items:center}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
h3{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text2)}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:600}
.badge-r{background:#300;color:var(--red)}
.badge-i{background:#004;color:var(--blue)}
.badge-p{background:#030;color:var(--green)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:500}
/* Layout */
#app{display:flex;flex-direction:column;height:100%}
#header{height:calc(var(--header-h) + var(--safe-t));background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:var(--safe-t) 16px 0;flex-shrink:0;z-index:10}
#header h1{font-size:15px;font-weight:700;line-height:1.2}
#header .sub{font-size:11px;color:var(--text2)}
#sync-chip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);white-space:nowrap;cursor:pointer}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(var(--tab-h) + var(--safe-b) + 12px)}
#tabnav{height:var(--tab-h);background:var(--bg1);border-top:1px solid var(--border);display:flex;position:fixed;bottom:0;left:0;right:0;padding-bottom:var(--safe-b);z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;border-top:3px solid transparent;background:none;color:var(--text3);font-size:12px;font-weight:500;padding:0;touch-action:manipulation;transition:color .15s,border-color .15s}
.tab-btn.active{color:#fff;border-top-color:var(--accent)}
.tab-btn.active svg{stroke:#fff}
.tab-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-panel{display:none}
.tab-panel.active{display:block}
/* Progress bar */
.progress-wrap{margin-bottom:14px}
.progress-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.progress-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-fill.green{background:var(--green)}
.progress-fill.orange{background:var(--orange)}
.progress-fill.blue{background:var(--blue)}
/* Exercises */
.ex-row{background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:8px}
.ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ex-name{font-weight:600;font-size:14px}
.ex-prev{font-size:12px;color:var(--text3)}
.sets-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.set-col{display:flex;flex-direction:column;gap:4px;align-items:center}
.set-label{font-size:11px;color:var(--text3)}
.set-inputs{display:flex;gap:4px}
.set-inputs input{width:52px;padding:8px 4px;font-size:15px}
/* Activity type buttons */
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.act-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border-radius:12px;min-height:80px;font-size:12px;text-align:center;line-height:1.2}
.act-btn.sel{border-color:var(--accent);color:var(--accent);background:#1a001a}
.act-emoji{font-size:28px;line-height:1}
/* HR Zones */
.hr-zone{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.hr-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
/* Week cards in Plan tab */
.week-card{background:var(--bg1);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.week-card-header{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.week-card-header.current{border-left:3px solid var(--accent)}
.week-card-body{padding:0 16px 14px;display:none}
.week-card-body.open{display:block}
.day-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.day-row:last-child{border-bottom:none}
.day-label{font-weight:600;font-size:12px;color:var(--text3);text-transform:uppercase;margin-bottom:3px}
/* Charts */
canvas{display:block;width:100%;border-radius:10px;background:var(--bg2)}
/* Entry list */
.entry-item{background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.entry-meta{font-size:12px;color:var(--text3);margin-top:3px}
.delete-btn{background:#300;color:var(--red);border:none;border-radius:8px;padding:6px 10px;font-size:12px;flex-shrink:0;margin-left:8px}
/* Form helpers */
.form-group{margin-bottom:14px}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.feeling-row{display:flex;gap:6px;flex-wrap:wrap}
.feeling-btn{width:40px;height:40px;border-radius:20px;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.feeling-btn.sel{background:var(--accent);color:#000;border-color:var(--accent)}
/* Section divider */
.sec{margin-top:20px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
/* Toggle switch */
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toggle input[type=checkbox]{width:40px;height:24px;border-radius:12px;appearance:none;-webkit-appearance:none;background:var(--bg3);border:none;position:relative;cursor:pointer;transition:background .2s}
.toggle input[type=checkbox]:checked{background:var(--accent)}
.toggle input[type=checkbox]::after{content:'';position:absolute;width:18px;height:18px;border-radius:9px;background:#fff;top:3px;left:3px;transition:left .2s}
.toggle input[type=checkbox]:checked::after{left:19px}
/* Autocollapse */
.chevron{transition:transform .2s;font-size:12px}
.open .chevron{transform:rotate(180deg)}
</style>
</head>

const STORE_KEY = 'trainplan_2026_v2';
let DATA = load();

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultData();
  } catch(e) { return defaultData(); }
}
function defaultData() {
  return {
    entries: [],
    settings: {
      syncUrl: '',
      stravaToken: '',
      hrZones: {z1:136,z2:142,z3:158,z4:168,max:195},

      customExB: null,
    }
  };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch(e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── WEEK UTILS ─────────────────────────────────────────────
function getISOWeek(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return { week: Math.ceil((((date - yearStart) / 86400000) + 1) / 7), year: date.getUTCFullYear() };
}
function currentKW() { return getISOWeek(new Date()); }
function getPlan(kw, yr) { return PLAN.find(p => p.kw === kw && p.yr === yr) || null; }
function getEntries(kw, yr) { return DATA.entries.filter(e => e.kw === kw && e.yr === yr); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${d}.${m}.${y}`;
}
function fmtDuration(min) {
  if (!min) return '';
  const h = Math.floor(min/60), m = min%60;
  return h ? `${h}h ${m}min` : `${m}min`;
}
function calcPace(km, min) {
  if (!km || !min) return '';
  const secPerKm = (min*60)/km;
  const m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  return `${m}:${s.toString().padStart(2,'0')}/km`;
}

// ── EXERCISES ──────────────────────────────────────────────
function dedupEx(list) {
  const seen = new Set();
  return list.filter(e => { if (seen.has(e.id)) return false; seen.add(e.id); return true; });
}
function getExA() { return dedupEx(DATA.settings.customExA || EX_A); }
function getExB() { return dedupEx(DATA.settings.customExB || EX_B); }
function isTimeUnit(unit) { return unit && unit.toLowerCase().startsWith('sek'); }
function numSets(plan) { return plan && plan.r ? 2 : 3; }

function getLastWeights(type) {
  const entries = DATA.entries
    .filter(e => e.type === type && e.exercises)
    .sort((a,b) => b.date.localeCompare(a.date));
  if (!entries.length) return {};
  const last = entries[0];
  const result = {};
  (last.exercises || []).forEach(ex => {
    result[ex.id] = ex.sets || [];
  });
  return result;
}

function renderEntryForm(type, plan) {
  if (type === 'kraft_a' || type === 'kraft_b') return renderKraftForm(type, plan);
  if (['longrun','threshold','interval','z2'].includes(type)) return renderLaufForm(type, plan);
  if (['rennrad','mtb','ebike','wandern'].includes(type)) return renderRadForm(type, plan);
  if (type === 'schwimmen') return renderSchwimmForm(plan);
  if (type === 'surfen') return renderSurfenForm();
  if (type === 'gewicht') return renderGewichtForm();
  return '';
}

function renderKraftForm(type, plan) {
  const exList = type === 'kraft_a' ? getExA() : getExB();
  const lastW = getLastWeights(type);
  const sets = numSets(plan);
  const label = type === 'kraft_a' ? '💪 Kraft A – Push' : '🏋️ Kraft B – Pull';

  const exRows = exList.map((ex, ei) => {
    const last = lastW[ex.id] || [];
    const isSek = isTimeUnit(ex.unit);
    const setInputs = Array.from({length: sets}, (_, si) => {
      const prev = last[si] || {};
      const inputs = isSek
        ? `<input type="number" inputmode="numeric" placeholder="${prev.sek||'Sek'}" id="ex${ei}_s${si}_sek" value="" style="width:80px" onfocus="this.placeholder=''">`
        : `<input type="number" inputmode="decimal" placeholder="${prev.kg||'kg'}" id="ex${ei}_s${si}_kg" value="" style="width:54px" onfocus="this.placeholder=''">
          <input type="number" inputmode="numeric" placeholder="${prev.reps||'Wdh'}" id="ex${ei}_s${si}_reps" value="" style="width:48px" onfocus="this.placeholder=''">`;
      return `<div class="set-col">
        <div class="set-label">S${si+1}</div>
        <div class="set-inputs">${inputs}</div>
      </div>`;
    }).join('');

    const prevSummary = last.length
      ? last.map(s => isSek ? `${s.sek||'?'}s` : `${s.kg||'?'}×${s.reps||'?'}`).join(' | ')
      : '–';

    return `<div class="ex-row">
      <div class="ex-header">
        <div>
          <div class="ex-name">${ex.id.toUpperCase()}: <span id="exname${ei}" contenteditable="true" onblur="updateExName(${ei},'${type}')">${ex.name}</span></div>
          <div class="ex-prev">Letztes Mal: ${prevSummary}</div>
        </div>
        <div style="font-size:11px;color:var(--text3)">${ex.unit}</div>
      </div>
      <div class="sets-grid">${setInputs}</div>
    </div>`;
  }).join('');

  const feelingBtns = Array.from({length:10}, (_,i) =>
    `<button class="feeling-btn" onclick="setFeeling(${i+1},this)">${i+1}</button>`
  ).join('');

  return `<div class="card">
    <h2>${label}</h2>
    <div class="input-row" style="margin-bottom:12px">
      <div class="form-group"><label>Datum</label><input type="date" id="k-date" value="${todayStr()}"></div>
      <div class="form-group"><label>Körpergewicht (kg)</label><input type="number" inputmode="decimal" id="k-kgw" placeholder="80"></div>
    </div>
    ${exRows}
    <div class="form-group" style="margin-top:12px">
      <label>Gefühl (1–10)</label>
      <div class="feeling-row" id="feeling-row">${feelingBtns}</div>
      <input type="hidden" id="k-feeling" value="">
    </div>
    <div class="form-group">
      <label>Notizen</label>
      <textarea id="k-notes" rows="2" placeholder="Notizen..."></textarea>
    </div>
    <button class="primary" style="width:100%" onclick="saveKraft('${type}',${exList.length},${sets})">Speichern</button>
  </div>`;
}

function updateExName(idx, type) {
  const el = document.getElementById('exname'+idx);
  if (!el) return;
  const name = el.textContent.trim();
  const exList = type === 'kraft_a' ? (DATA.settings.customExA || [...EX_A]) : (DATA.settings.customExB || [...EX_B]);
  if (exList[idx]) exList[idx] = {...exList[idx], name};
  if (type === 'kraft_a') DATA.settings.customExA = exList;
  else DATA.settings.customExB = exList;
  save();
}

function setFeeling(val, btn) {
  document.querySelectorAll('.feeling-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('k-feeling').value = val;
}

function saveKraft(type, exCount, sets) {
  const exList = type === 'kraft_a' ? getExA() : getExB();
  const exercises = [];
  for (let ei = 0; ei < exCount; ei++) {
    const exSets = [];
    for (let si = 0; si < sets; si++) {
      const sekEl = document.getElementById(`ex${ei}_s${si}_sek`);
      const kgEl  = document.getElementById(`ex${ei}_s${si}_kg`);
      const repsEl= document.getElementById(`ex${ei}_s${si}_reps`);
      if (sekEl)      exSets.push({ sek: sekEl.value || null });
      else if (kgEl)  exSets.push({ kg: kgEl.value || null, reps: repsEl?.value || null });
    }
    exercises.push({ id: exList[ei]?.id || String(ei), name: exList[ei]?.name || '', sets: exSets });
  }

  const kgw = document.getElementById('k-kgw')?.value;
  const date = document.getElementById('k-date')?.value || todayStr();

  const entry = {
    id: uid(), kw: eintragenState.kw, yr: eintragenState.yr,
    type, date, kgw: kgw || null,
    feeling: document.getElementById('k-feeling')?.value || null,
    notes: document.getElementById('k-notes')?.value || null,
    exercises, synced: false
  };

  DATA.entries.push(entry);
  if (kgw) DATA.entries.push({id: uid(), kw: eintragenState.kw, yr: eintragenState.yr, type:'gewicht', date, kg: kgw, synced: false});
  save();
  trySync();
  eintragenState.actType = null;
  renderEintragen();
  showToast('Gespeichert ✓');
}

function calcLaufPace() {
  const km = parseFloat(document.getElementById('l-km')?.value);
  const min = parseFloat(document.getElementById('l-time')?.value);
  const el = document.getElementById('l-pace');
  if (el) el.value = calcPace(km, min) || '–';
}

function entryHTML(e) {
  const typeLabels = {
    kraft_a:'💪 Kraft A',kraft_b:'🏋️ Kraft B',
    longrun:'🏃 Longrun',threshold:'🔥 Threshold',interval:'⚡ Intervall',z2:'🌿 Z2',
    rennrad:'🚴 Rennrad',mtb:'🏔️ MTB',ebike:'🚴 E-Bike',wandern:'🥾 Wandern',
    schwimmen:'🏊 Schwimmen',surfen:'🏄 Surfen',gewicht:'⚖️ Gewicht'
  };
  let detail = '';
  if (e.km) detail += `${parseFloat(e.km).toFixed(1)} km`;
  if (e.timeMin) detail += (detail?' · ':'')+fmtDuration(parseFloat(e.timeMin));
  if (e.hrAvg) detail += (detail?' · ':'')+`Ø ${e.hrAvg} bpm`;
  if (e.pace) detail += (detail?' · ':'')+e.pace;
  if (e.kg && e.type==='gewicht') detail = `${e.kg} kg`;
  if (e.exercises) detail = `${e.exercises.length} Übungen · ${e.exercises[0]?.sets?.length||0} Sätze`;

  return `<div class="entry-item">
    <div style="flex:1">
      <div style="font-weight:600">${typeLabels[e.type]||e.type}</div>
      <div class="entry-meta">${fmtDate(e.date)} ${detail ? '· '+detail : ''}</div>
      ${e.notes ? `<div style="font-size:12px;color:var(--text2);margin-top:3px">${e.notes.slice(0,60)}${e.notes.length>60?'…':''}</div>` : ''}
    </div>
    <button class="delete-btn" onclick="deleteEntry('${e.id}')">✕</button>
  </div>`;
}

function deleteEntry(id) {
  if (!confirm('Eintrag löschen?')) return;
  DATA.entries = DATA.entries.filter(e => e.id !== id);
  save();
  renderEintragen();
}

  const allRides = DATA.entries.filter(e => ['rennrad','mtb','ebike'].includes(e.type));

  const kraftTotal = DATA.entries.filter(e => ['kraft_a','kraft_b'].includes(e.type)).length;

      </div>
      <div class="card" style="text-align:center">

    <div class="sec">Lauf-km / Woche</div>

          <span>${name}</span><span style="font-weight:700;color:var(--accent)">${kg} kg</span>

// ── CHARTS ─────────────────────────────────────────────────
function drawWeightChart() {
  const canvas = document.getElementById('chart-weight');
  if (!canvas) return;
  const weights = DATA.entries.filter(e => e.type==='gewicht' && e.kg)
    .sort((a,b) => a.date.localeCompare(b.date))
    .map(e => ({ d: fmtDate(e.date).slice(0,5), v: parseFloat(e.kg) }));

  drawLineChart(canvas, weights, 'var(--accent)', { unit: 'kg', minPad: 2 });
}

function drawRunChart() {
  const canvas = document.getElementById('chart-run');
  if (!canvas) return;
  const byWeek = {};
  DATA.entries.filter(e => ['longrun','threshold','interval','z2'].includes(e.type) && e.km).forEach(e => {
    const key = `${e.yr}-${String(e.kw).padStart(2,'0')}`;
    byWeek[key] = (byWeek[key]||0) + parseFloat(e.km);
  });
  const planByWeek = {};
  PLAN.forEach(p => {
    const key = `${p.yr}-${String(p.kw).padStart(2,'0')}`;
    planByWeek[key] = p.lauf;
  });

  const keys = Object.keys(byWeek).sort();
  const bars = keys.map(k => ({ label: 'KW'+parseInt(k.split('-')[1]), ist: byWeek[k], soll: planByWeek[k]||0 }));
  drawBarChart(canvas, bars, 'var(--green)');
}

function drawRideChart() {
  const canvas = document.getElementById('chart-ride');
  if (!canvas) return;
  const byWeek = {};
  DATA.entries.filter(e => ['rennrad','mtb','ebike'].includes(e.type) && e.km).forEach(e => {
    const key = `${e.yr}-${String(e.kw).padStart(2,'0')}`;
    byWeek[key] = (byWeek[key]||0) + parseFloat(e.km);
  });
  const keys = Object.keys(byWeek).sort();
  const bars = keys.map(k => ({ label: 'KW'+parseInt(k.split('-')[1]), ist: byWeek[k], soll: 0 }));
  drawBarChart(canvas, bars, 'var(--blue)');
}

function drawLineChart(canvas, data, color, opts={}) {
  const W = canvas.offsetWidth || 300;
  const H = parseInt(canvas.getAttribute('height')) || 160;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const bg = '#1a1a1a';
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  if (data.length < 2) {
    ctx.fillStyle = '#555';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Noch keine Daten', W/2, H/2);
    return;
  }

  const vals = data.map(d => d.v);
  const minV = Math.min(...vals) - (opts.minPad||0);
  const maxV = Math.max(...vals) + (opts.minPad||0);
  const range = maxV - minV || 1;

  const pad = {l:30, r:10, t:10, b:30};
  const cW = W - pad.l - pad.r;
  const cH = H - pad.t - pad.b;

  const xOf = i => pad.l + (i/(data.length-1)) * cW;
  const yOf = v => pad.t + (1 - (v-minV)/range) * cH;

  // Grid lines
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  [0, 0.5, 1].forEach(f => {
    const y = pad.t + f * cH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    const lv = maxV - f * range;
    ctx.fillStyle = '#666'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(lv.toFixed(1), pad.l-4, y+4);
  });

  // Line
  ctx.beginPath();
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  data.forEach((d,i) => {
    const x = xOf(i), y = yOf(d.v);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Fill
  ctx.beginPath();
  data.forEach((d,i) => {
    const x = xOf(i), y = yOf(d.v);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(xOf(data.length-1), H-pad.b);
  ctx.lineTo(pad.l, H-pad.b);
  ctx.closePath();
  ctx.fillStyle = color.replace(')',',0.15)').replace('var(--accent)','rgba(238,136,255,0.15)').replace('var(--green)','rgba(68,255,68,0.15)');
  ctx.fill();

  // Dots + labels
  data.forEach((d,i) => {
    const x = xOf(i), y = yOf(d.v);
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    if (i % Math.ceil(data.length/6) === 0) {
      ctx.fillStyle = '#888'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.d, x, H-pad.b+12);
    }
  });
}

function drawBarChart(canvas, data, color) {
  const W = canvas.offsetWidth || 300;
  const H = parseInt(canvas.getAttribute('height')) || 140;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0,0,W,H);

  if (!data.length) {
    ctx.fillStyle = '#555'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Noch keine Daten', W/2, H/2);
    return;
  }

  const maxV = Math.max(...data.map(d => Math.max(d.ist, d.soll)), 1);
  const pad = {l:30, r:6, t:10, b:28};
  const cW = W - pad.l - pad.r;
  const cH = H - pad.t - pad.b;
  const bW = (cW / data.length) - 4;

  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  [0, 0.5, 1].forEach(f => {
    const y = pad.t + f * cH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxV*(1-f)), pad.l-4, y+4);
  });

  data.forEach((d, i) => {
    const x = pad.l + i * (cW/data.length) + 2;
    const yBase = pad.t + cH;

    // Ghost bar (soll)
    if (d.soll > 0) {
      const h = (d.soll/maxV) * cH;
      ctx.fillStyle = '#333';
      ctx.fillRect(x, yBase-h, bW, h);
    }

    // Actual bar
    if (d.ist > 0) {
      const h = (d.ist/maxV) * cH;
      ctx.fillStyle = color;
      ctx.fillRect(x, yBase-h, bW, h);
    }

    // Label
    ctx.fillStyle = '#666'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d.label, x + bW/2, H - pad.b + 12);
  });
}

// ── SYNC ───────────────────────────────────────────────────
let syncState = 'idle'; // idle | loading | syncing | error
let syncPending = false;

function updateSyncChip() {
  const el = document.getElementById('sync-chip');
  if (!el) return;
  const url = DATA.settings.syncUrl;
  if (!url) { el.textContent = '○ kein Sync'; el.style.color=''; return; }
  const unsynced = DATA.entries.filter(e => !e.synced).length;
  if (syncState === 'loading') { el.textContent = '↓ Laden…'; el.style.color='var(--blue)'; }
  else if (syncState === 'syncing') { el.textContent = '⟳ sync…'; el.style.color='var(--orange)'; }
  else if (unsynced > 0) { el.textContent = `● ${unsynced} offen`; el.style.color='var(--orange)'; }
  else { el.textContent = '● gesichert'; el.style.color='var(--green)'; }
}

function saveSyncUrl() {
  const url = document.getElementById('sync-url')?.value?.trim();
  DATA.settings.syncUrl = url || '';
  save();
  updateSyncChip();
  if (url) trySync();
  showToast('URL gespeichert');
}

// ── STRAVA ─────────────────────────────────────────────────
const STRAVA_TYPE_MAP = {
  WeightTraining: {emoji:'💪', label:'Krafttraining', type:'kraft_a'},
  Run:            {emoji:'🏃', label:'Lauf',          type:'z2'},
  VirtualRun:     {emoji:'🏃', label:'Lauf (Virtual)',type:'z2'},
  Ride:           {emoji:'🚴', label:'Rennrad',        type:'rennrad'},
  VirtualRide:    {emoji:'🚴', label:'Indoor Rad',     type:'rennrad'},
  MountainBikeRide:{emoji:'🏔️', label:'MTB',          type:'mtb'},
  EBikeRide:      {emoji:'⚡', label:'E-Bike',         type:'ebike'},
  Hike:           {emoji:'🥾', label:'Wandern',        type:'wandern'},
  Walk:           {emoji:'🚶', label:'Spazieren',      type:'wandern'},
  Swim:           {emoji:'🏊', label:'Schwimmen',      type:'schwimmen'},
  Surfing:        {emoji:'🏄', label:'Surfen',          type:'surfen'},
};

function saveStravaToken() {
  const tok = document.getElementById('strava-token-input')?.value?.trim();
  DATA.settings.stravaToken = tok || '';
  save();
  showToast(tok ? 'Token gespeichert ✓' : 'Token gelöscht');
  renderHeute();
}

function loadStravaActivities() {
  const token = DATA.settings.stravaToken;
  const el = document.getElementById('strava-list');
  if (!el || !token) return;

  el.innerHTML = '<div style="color:var(--text3);font-size:14px;text-align:center;padding:16px">⟳ Lade Strava…</div>';

  const since = Math.floor((Date.now() - 7 * 86400000) / 1000);
  fetch(`https://www.strava.com/api/v3/athlete/activities?per_page=15&after=${since}`, {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(r => {
    if (r.status === 401) throw new Error('Token abgelaufen');
    return r.json();
  })
  .then(acts => {
    if (!Array.isArray(acts) || acts.length === 0) {
      el.innerHTML = '<div style="color:var(--text3);font-size:14px;text-align:center;padding:16px">Keine Aktivitäten in den letzten 7 Tagen.</div>';
      return;
    }
    el.innerHTML = acts.map(a => {
      const meta = STRAVA_TYPE_MAP[a.type] || {emoji:'🏅', label:a.type, type:null};
      const dist = a.distance > 0 ? (a.distance/1000).toFixed(1)+'km' : '';
      const mins = Math.round(a.moving_time / 60);
      const dur = mins >= 60 ? `${Math.floor(mins/60)}h${mins%60}min` : `${mins}min`;
      const hr = a.average_heartrate ? ` · ø${Math.round(a.average_heartrate)} bpm` : '';
      const date = a.start_date_local?.slice(0,10) || '';
      const alreadyImported = DATA.entries.some(e => e.stravaId === a.id);
      return `<div class="card" style="margin-bottom:8px;${alreadyImported?'opacity:.5':''}">
        <div class="row-sb" style="margin-bottom:4px">
          <span style="font-weight:700">${meta.emoji} ${a.name}</span>
          <span style="font-size:12px;color:var(--text3)">${date}</span>
        </div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:${meta.type&&!alreadyImported?'10':'0'}px">
          ${meta.label}${dist?' · '+dist:''} · ${dur}${hr}
        </div>
        ${meta.type && !alreadyImported ? `<button onclick="importStrava(${JSON.stringify(a).replace(/"/g,'&quot;')})" style="width:100%;font-size:13px">Importieren →</button>` : ''}
        ${alreadyImported ? '<div style="font-size:12px;color:var(--green)">✓ bereits importiert</div>' : ''}
      </div>`;
    }).join('');
  })
  .catch(err => {
    el.innerHTML = `<div class="card" style="border-color:var(--red)">
      <div style="color:var(--red);font-size:14px;margin-bottom:8px">⚠ ${err.message}</div>
      ${err.message.includes('abgelaufen') ? '<div style="font-size:12px;color:var(--text2)">Token erneuern: <code>cat .tokens.json</code> und access_token neu eintragen (Fortschritt → Strava Verbindung)</div>' : ''}
    </div>`;
  });
}

function importStrava(act) {
  const meta = STRAVA_TYPE_MAP[act.type] || {type: null};
  if (!meta.type) return;
  const {week, year} = currentKW();
  const km = act.distance > 0 ? (act.distance/1000).toFixed(2) : '';
  const mins = Math.round(act.moving_time / 60);
  const entry = {
    id: uid(),
    stravaId: act.id,
    type: meta.type,
    date: act.start_date_local?.slice(0,10) || new Date().toISOString().slice(0,10),
    kw: week, yr: year,
    km: km,
    timeMin: mins,
    hrAvg: act.average_heartrate ? Math.round(act.average_heartrate) : '',
    hrMax: act.max_heartrate ? Math.round(act.max_heartrate) : '',
    elevation: act.total_elevation_gain ? Math.round(act.total_elevation_gain) : '',
    notes: `Importiert von Strava: ${act.name}`,
    synced: false,
  };
  DATA.entries.push(entry);
  save();
  showToast('Importiert! ✓');
  trySync();
  loadStravaActivities(); // neu laden um "bereits importiert" zu zeigen
}

function trySync() {
  if (!DATA.settings.syncUrl) return;
  if (syncState === 'syncing') { syncPending = true; return; }
  const toSync = DATA.entries.filter(e => !e.synced);
  if (!toSync.length) { updateSyncChip(); return; }

  syncState = 'syncing';
  updateSyncChip();

  fetch(DATA.settings.syncUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({entries: toSync})
  }).then(() => {
    toSync.forEach(e => { const found = DATA.entries.find(x => x.id===e.id); if (found) found.synced = true; });
    save();
    syncState = 'idle';
    updateSyncChip();
    if (syncPending) { syncPending = false; trySync(); }
  }).catch(() => {
    syncState = 'idle';
    updateSyncChip();
  });
}

function syncNow() {
  DATA.entries.forEach(e => e.synced = false);
  save();
  trySync();
}

function resetSync() {
  syncNow();
  showToast('Alle Daten werden neu gesendet…');
}

// ── BIDIREKTIONALER SYNC: Daten aus Google Sheets laden ────
function loadFromCloud(callback) {
  const url = DATA.settings.syncUrl;
  if (!url) { if (callback) callback(); return; }

  syncState = 'loading';
  updateSyncChip();

  fetch(url + '?action=export', { cache: 'no-store' })
    .then(r => r.json())
    .then(remoteEntries => {
      if (!Array.isArray(remoteEntries)) throw new Error('Keine Array-Antwort');

      // Neue IDs aus der Cloud einfügen (Dedup per id)
      const localIds = new Set(DATA.entries.map(e => e.id));
      let added = 0;
      remoteEntries.forEach(re => {
        if (re && re.id && !localIds.has(re.id)) {
          re.synced = true; // aus Cloud → gilt als synchronisiert
          DATA.entries.push(re);
          localIds.add(re.id);
          added++;
        }
      });

      if (added > 0) {
        save();
        renderHeute();
        showToast(`↓ ${added} Einträge geladen`);
      }

      // Jetzt lokale ungesicherte Einträge hochladen
      syncState = 'idle';
      updateSyncChip();
      trySync();
      if (callback) callback();
    })
    .catch(err => {
      console.warn('Cloud-Load fehlgeschlagen:', err);
      syncState = 'idle';
      updateSyncChip();
      trySync(); // trotzdem versuchen, lokale Daten hochzuladen
      if (callback) callback();
    });
}

function openSyncSettings() {
  switchTab('fortschritt', document.getElementById('btn-fortschritt'));
  setTimeout(() => {
    document.querySelector('#tab-fortschritt input[type=url]')?.scrollIntoView({behavior:'smooth',block:'center'});
  }, 200);
}

// ── MODAL ──────────────────────────────────────────────────
function showModal(html) {
  let m = document.getElementById('modal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'modal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-end;padding:16px;box-sizing:border-box';
    m.onclick = (e) => { if (e.target === m) closeModal(); };
    document.body.appendChild(m);
  }
  m.innerHTML = `<div style="width:100%;max-width:500px;margin:auto">${html}</div>`;
  m.style.display = 'flex';
}

function closeModal() {
  const m = document.getElementById('modal');
  if (m) m.style.display = 'none';
}

// ── TOAST ──────────────────────────────────────────────────
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:2000;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

// ── INIT ───────────────────────────────────────────────────
function init() {
  renderHeute();
  updateSyncChip();
  // Beim Start: aus der Cloud laden (holt neue Einträge anderer Geräte)
  // dann lokale Einträge hochladen
  if (DATA.settings.syncUrl) {
    loadFromCloud();
  }
}

init();
</script>
